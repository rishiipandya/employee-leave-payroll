apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-service
  namespace: employee-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: employee-service
  template:
    metadata:
      labels:
        app: employee-service
    spec:
      containers:
        - name: employee-service
          image: employee-leave-payroll-employee-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8002
---
apiVersion: v1
kind: Service
metadata:
  name: employee-service
  namespace: employee-system
spec:
  selector:
    app: employee-service
  ports:
    - port: 8002
      targetPort: 8002
