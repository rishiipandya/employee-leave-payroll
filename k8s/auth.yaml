apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: employee-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: employee-leave-payroll-auth-service:latest
          imagePullPolicy: Never
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: employee-secret
                  key: JWT_SECRET
          ports:
            - containerPort: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: employee-system
spec:
  selector:
    app: auth-service
  ports:
    - port: 8001
      targetPort: 8001
